name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: swan-mpo verify --manuscript
      - run: swan-mpo score --demo --output-dir demo_results
      - run: swan-mpo reproduce-manuscript --output-dir manuscript_reproduction
      - run: python scripts/audit_release.py
      - run: python scripts/license_audit.py
