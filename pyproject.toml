[build-system]
requires=["setuptools==80.9.0","wheel==0.45.1"]
build-backend="setuptools.build_meta"

[project]
name="swan-mpo"
version="1.3.2"
description="Safety-aware multi-parameter optimization from raw docking, ADME, toxicity, and reference-redocking outputs."
readme="README.md"
requires-python=">=3.13,<3.14"
license={text="MIT"}
authors=[{name="Saanvii Senthilkumar"}]
dependencies=[
  "numpy==2.3.5",
  "networkx==3.6.1"
]
classifiers=[
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry"
]

[project.optional-dependencies]
dev=["pytest==9.0.2"]

[project.scripts]
swan-mpo="swan_mpo.cli:main"

[tool.setuptools]
package-dir={""="src"}
include-package-data=true

[tool.setuptools.packages.find]
where=["src"]

[tool.setuptools.package-data]
"swan_mpo.resources"=["*.csv","*.json","*.md"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra"
markers=[
  "real_vina: requires an actual AutoDock Vina installation and user-supplied redocking config"
]
